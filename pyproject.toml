[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "copilot-token-dashboard"
version = "1.0.0"
description = "Tenant-owned Power BI reporting for Copilot and AI usage, spend, and data quality"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "requests>=2.32.3,<3",
    "msal>=1.32,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "jsonschema>=4.23,<5",
    "reportlab>=4.4,<5",
    "pypdf>=6,<8",
]

[project.scripts]
ctd = "copilot_token_dashboard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
