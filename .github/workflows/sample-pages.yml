name: Publish synthetic dashboard sample

on:
  push:
    branches: [main]
    paths:
      - docs/assets/sample-dashboard.html
      - .github/workflows/sample-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: synthetic-sample-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Stage only the standalone synthetic sample
        run: |
          mkdir -p _site
          cp docs/assets/sample-dashboard.html _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy sample
        id: deployment
        uses: actions/deploy-pages@v4
